version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - noctx
          # Test helpers close response bodies through t.Cleanup, which bodyclose cannot follow.
          - bodyclose
      - linters:
          - revive
        text: "should have comment|should have a package comment"

formatters:
  enable:
    - gofmt
    - goimports
